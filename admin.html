<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cutify • Administração</title><style>
:root{color-scheme:dark;--bg:#090909;--panel:#141414;--line:#292929;--muted:#999;--white:#f5f5f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font:15px Inter,system-ui,Arial}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:#f4f4f4;color:#111;font-weight:650}input,select,textarea{width:100%;background:#0d0d0d;border:1px solid var(--line);border-radius:9px;padding:12px;color:#fff}label{display:block;color:#aaa;font-size:13px;margin:12px 0 6px}.wrap{max-width:1100px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}.brand{font-weight:800;letter-spacing:.12em}.muted{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}.login{max-width:390px;margin:10vh auto}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.stat{background:var(--panel);border:1px solid var(--line);padding:16px;border-radius:12px}.stat b{display:block;font-size:26px;margin-top:6px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.tools input{max-width:360px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:13px;border-bottom:1px solid var(--line)}th{color:#aaa;font-size:12px;text-transform:uppercase}td button{padding:7px 10px}.hidden{display:none!important}.error{color:#ff7777;margin-top:12px}.detail{margin-top:16px;white-space:pre-wrap;line-height:1.6}.detail h3{margin-bottom:4px}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="wrap"><header class="top"><div><div class="brand">CUTIFY <span class="muted">/ ADMIN</span></div><p class="muted">Painel de recrutamento</p></div><button id="logout" class="hidden">Sair</button></header>
<section id="login" class="panel login"><h2>Acesso administrativo</h2><form id="loginForm"><label>Usuário</label><input id="user" autocomplete="username" required><label>Senha</label><input id="pass" type="password" autocomplete="current-password" required><p id="loginError" class="error"></p><button style="width:100%;margin-top:14px">Entrar</button></form></section>
<section id="dashboard" class="hidden"><div class="grid"><div class="stat">Total<b id="total">0</b></div><div class="stat">Pendentes<b id="pendente">0</b></div><div class="stat">Em análise<b id="em_analise">0</b></div><div class="stat">Aprovadas<b id="aprovada">0</b></div></div><div class="panel"><div class="tools"><input id="search" placeholder="Buscar por nome, Discord ou ID"><select id="filter"><option value="all">Todos os status</option><option value="pendente">Pendente</option><option value="em_analise">Em análise</option><option value="aprovada">Aprovada</option><option value="recusada">Recusada</option></select><button id="refresh">Atualizar</button></div><div class="tablewrap"><table><thead><tr><th>Candidato</th><th>Cargo</th><th>Status</th><th>Data</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><p id="listError" class="error"></p></div><div id="detail" class="panel detail hidden"></div></section></main>
<script>
const $=id=>document.getElementById(id);async function api(url,opts={}){const r=await fetch(url,{credentials:'same-origin',...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||`HTTP ${r.status}`);return d}
function show(dash){$('login').classList.toggle('hidden',dash);$('dashboard').classList.toggle('hidden',!dash);$('logout').classList.toggle('hidden',!dash)}
async function session(){try{const s=await api('/api/session');if(s.admin){show(true);load()}else show(false)}catch{show(false)}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginError').textContent='';try{await api('/api/login',{method:'POST',body:JSON.stringify({user:$('user').value,pass:$('pass').value})});$('pass').value='';show(true);load()}catch(err){$('loginError').textContent=err.message}});
$('logout').onclick=async()=>{await api('/api/logout',{method:'POST'});show(false)};$('refresh').onclick=load;$('filter').onchange=load;let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(load,250)};
async function load(){try{const p=new URLSearchParams({q:$('search').value,status:$('filter').value});const d=await api('/api/candidaturas?'+p);Object.entries(d.stats).forEach(([k,v])=>{if($(k))$(k).textContent=v});$('rows').innerHTML=d.items.map(c=>`<tr><td><b>${esc(c.nome)}</b><br><small class="muted">${esc(c.discord_user)} · ${esc(c.id)}</small></td><td>${esc(c.cargo_principal)}</td><td>${esc(c.status)}</td><td>${new Date(c.criado_em).toLocaleDateString('pt-BR')}</td><td><button data-id="${esc(c.id)}">Ver</button></td></tr>`).join('')||'<tr><td colspan="5" class="muted">Nenhuma candidatura encontrada.</td></tr>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>details(b.dataset.id));$('listError').textContent=''}catch(e){$('listError').textContent=e.message}}
async function details(id){try{const d=await api('/api/candidaturas/'+encodeURIComponent(id));const c=d.candidatura;const fields=['nome','idade','discord_user','discord_id','pais','fuso','cargo_principal','cargo_secundario','experiencia','tempo_disponivel','q1','q2','q3','q4','q5','q6','q7'];$('detail').classList.remove('hidden');$('detail').innerHTML=`<h2>${esc(c.nome)} · ${esc(c.id)}</h2><label>Status</label><select id="newStatus">${['pendente','em_analise','aprovada','recusada'].map(s=>`<option ${s===c.status?'selected':''} value="${s}">${s}</option>`).join('')}</select><label>Observações internas</label><textarea id="notes" rows="3">${esc(c.observacoes||'')}</textarea><button id="saveDetail">Salvar alterações</button><div style="margin-top:18px">${fields.map(k=>`<p><b>${esc(k.replaceAll('_',' '))}:</b><br>${esc(c[k]??'')}</p>`).join('')}</div>`;$('saveDetail').onclick=async()=>{await api(`/api/candidaturas/${id}/status`,{method:'PATCH',body:JSON.stringify({status:$('newStatus').value,observacao:'Status atualizado no painel'})});await api(`/api/candidaturas/${id}/observacoes`,{method:'PATCH',body:JSON.stringify({observacoes:$('notes').value})});await load();alert('Alterações salvas.')}}catch(e){alert(e.message)}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}session();
</script></body></html>
